<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
    }

    .header {
      background: #181818;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    #chat {
      height: calc(100vh - 135px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin: 10px 0;
      padding: 12px 15px;
      border-radius: 15px;
      max-width: 85%;
      line-height: 1.5;
    }

    .user {
      background: #075e54;
      margin-left: auto;
    }

    .bot {
      background: #292929;
      margin-right: auto;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      padding: 10px;
      background: #181818;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #444;
      border-radius: 25px;
      background: #252525;
      color: white;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 25px;
      padding: 0 20px;
      background: #00a884;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="header">
    🤖 Cyber AI
  </div>

  <div id="chat">
    <div class="message bot">
      আসসালামু আলাইকুম! 👋 আমি Cyber AI। আমাকে কিছু জিজ্ঞেস করো।
    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="এখানে লিখো..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");

      const text = input.value.trim();

      if (!text) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;
      chat.appendChild(userMessage);

      input.value = "";

      setTimeout(() => {
        const botMessage = document.createElement("div");
        botMessage.className = "message bot";

        botMessage.textContent =
          "তোমার মেসেজ পেয়েছি! 🤖 এখন আমাকে AI-এর সাথে connect করলে আমি আরও বুদ্ধিমান উত্তর দিতে পারব।";

        chat.appendChild(botMessage);
        chat.scrollTop = chat.scrollHeight;
      }, 500);

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
